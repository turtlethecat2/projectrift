services:
  postgres:
    image: postgres:15-alpine
    container_name: project-rift-db
    environment:
      POSTGRES_DB: ${DB_NAME:-project_rift}
      POSTGRES_USER: ${DB_USER:-rift_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rift_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rift_user} -d ${DB_NAME:-project_rift}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
