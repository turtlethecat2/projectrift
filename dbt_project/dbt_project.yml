name: "sdr_rift"
version: "1.0.0"
config-version: 2

profile: "sdr_rift"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  sdr_rift:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: analytics

vars:
  raw_events_retention_days: 90
  xp_per_level: 1000
  rank_thresholds:
    iron: 0
    bronze: 200
    silver: 500
    gold: 1000
    platinum: 1500
    diamond: 3000
    challenger: 5000
